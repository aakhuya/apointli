
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: apointli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apointli
      POSTGRES_PASSWORD: apointli123
      POSTGRES_DB: apointli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apointli -d apointli"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - apointli-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: apointli-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - apointli-network

volumes:
  postgres_data:
  redis_data:

networks:
  apointli-network:
    driver: bridge
