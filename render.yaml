services:
  # ─── FastAPI Web Service ───
  - type: web
    name: apointli-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: apointli-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: apointli-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: apointli <onboarding@resend.dev>
      - key: CORS_ORIGINS_RAW
        sync: false

  # ─── Celery Worker ───
  - type: worker
    name: apointli-celery-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: oregon
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        fromService:
          type: web
          name: apointli-api
          envVarKey: SECRET_KEY
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: apointli-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: apointli-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: apointli <onboarding@resend.dev>
      - key: APP_BASE_URL
        sync: false

  # ─── Celery Beat (scheduler) ───
  - type: worker
    name: apointli-celery-beat
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: oregon
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: apointli-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: apointli-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: apointli-redis
          property: connectionString
      - key: APP_BASE_URL
        sync: false

  # ─── Key Value (Redis) ───
  - type: keyvalue
    name: apointli-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: apointli-db
    plan: free
    region: oregon
    databaseName: apointli
    user: apointli
